
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Tienda - Buscador de precios</title>

    <link rel="stylesheet" href="estilos.css">

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>MI TIENDA</h1>
        <p>Buscador de precios</p>
    </header>

    <main>

        <!-- INICIO DE SESIÓN -->
        <section id="loginSection" class="panel">

            <h2>Iniciar sesión</h2>

            <form id="loginForm">

                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Tu correo electrónico"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Tu contraseña"
                    required
                >

                <button type="submit">Ingresar</button>

            </form>

            <p id="loginMessage" class="message"></p>

        </section>

        <!-- APLICACIÓN -->
        <section id="appSection" hidden>

            <div class="user-bar">
                <span id="userEmail"></span>
                <button id="logoutButton" class="logout-button">
                    Cerrar sesión
                </button>
            </div>

            <section class="panel">

                <h2>Buscar productos</h2>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Escribe el nombre del producto..."
                >

            </section>

            <section class="panel">

                <h2 id="formTitle">Agregar producto</h2>

                <form id="productForm">

                    <label for="productName">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Ej. Arroz"
                        maxlength="100"
                        required
                    >

                    <label for="productPrice">
                        Precio en Bs
                    </label>

                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Ej. 15"
                        min="0"
                        step="0.01"
                        required
                    >

                    <div class="form-buttons">

                        <button type="submit" id="saveButton">
                            Agregar producto
                        </button>

                        <button
                            type="button"
                            id="cancelButton"
                            class="cancel-button"
                            hidden
                        >
                            Cancelar edición
                        </button>

                    </div>

                </form>

                <p id="productMessage" class="message"></p>

            </section>

            <section class="panel">

                <h2>Lista de productos</h2>

                <p id="productCount"></p>

                <div id="productList">
                    Cargando productos...
                </div>

            </section>

        </section>

    </main>

    <footer>
        <p>Mi Tienda © 2026</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
